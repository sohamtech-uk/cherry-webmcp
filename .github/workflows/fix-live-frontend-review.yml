name: Fix live frontend review findings

on:
  push:
    branches:
      - feature/cherry-production-openai-bridge
    paths:
      - scripts/fix_live_frontend_review.py
      - .github/workflows/fix-live-frontend-review.yml

permissions:
  contents: write

jobs:
  fix-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/cherry-production-openai-bridge
          fetch-depth: 0

      - name: Apply review corrections
        run: python scripts/fix_live_frontend_review.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run all safety contracts
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit corrected reviewable source
        run: |
          rm -f scripts/fix_live_frontend_review.py
          rm -f .github/workflows/fix-live-frontend-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make live routing non-recursive and expire stale sessions"
          git push origin HEAD:feature/cherry-production-openai-bridge
