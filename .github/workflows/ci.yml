name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deterministic finance and safety tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: cherry-webmcp-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Publish verified bundle for production delivery
        if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/cherry-webmcp-dist
          cp -R dist/. /tmp/cherry-webmcp-dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan vercel-dist
          git rm -rf . || true
          git clean -fdx
          cp -R /tmp/cherry-webmcp-dist/. .
          touch .nojekyll
          git add .
          git commit -m "deploy: verified bundle from ${GITHUB_SHA}"
          git push --force origin HEAD:vercel-dist
