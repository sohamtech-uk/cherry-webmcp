name: Apply live Cherry Money production bridge

on:
  push:
    branches:
      - feature/cherry-production-openai-bridge
    paths:
      - scripts/apply_live_frontend.py
      - .github/workflows/apply-live-production-bridge.yml

permissions:
  contents: write

jobs:
  apply-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/cherry-production-openai-bridge
          fetch-depth: 0

      - name: Apply authenticated production bridge
        run: python scripts/apply_live_frontend.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run deterministic safety contracts
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit reviewable source only
        run: |
          rm -f scripts/apply_live_frontend.py
          rm -f .github/workflows/apply-live-production-bridge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: connect WebMCP UI to Cherry Money production and server-side OpenAI"
          git push origin HEAD:feature/cherry-production-openai-bridge
